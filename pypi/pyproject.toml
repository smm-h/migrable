[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "migrable"
version = "0.7.0"
description = "Declarative config file migrations for TOML"
license = "MIT"
requires-python = ">=3.8"
readme = "README.md"
keywords = ["rlsbl"]

[project.urls]
Homepage = "https://github.com/smm-h/migrable"
Repository = "https://github.com/smm-h/migrable"

[project.scripts]
migrable = "migrable:main"
