[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "migrable"
version = "0.1.2"
description = "Declarative config file migrations for TOML"
license = "MIT"
requires-python = ">=3.8"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/smm-h/migrable"
Repository = "https://github.com/smm-h/migrable"

[project.scripts]
migrable = "migrable:main"
